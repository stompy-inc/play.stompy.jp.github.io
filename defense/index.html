<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食虫植物タワーディフェンス</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #14170f;
    color: #f0e6d2;
    font-family: "Yu Gothic", "Meiryo", "Hiragino Sans", sans-serif;
    overflow-x: hidden;
  }
  #app {
    max-width: 800px;
    margin: 0 auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #hud {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    background: #25361f;
    border: 2px solid #3d5233;
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 8px;
    gap: 10px;
    font-size: 15px;
  }
  #hud .stat { white-space: nowrap; }
  #hud .stat b { color: #e8c468; }
  #warnBadge {
    display: none;
    color: #ff5252;
    font-weight: bold;
    animation: warnBlink 0.8s infinite alternate;
  }
  @keyframes warnBlink { from { opacity: 0.5; } to { opacity: 1; } }
  #debugToggle { font-size: 12px; color: #b7c9a8; display: flex; align-items: center; gap: 4px; cursor: pointer; }

  #canvasWrap {
    position: relative;
    border: 3px solid #5a4632;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  }
  canvas { display: block; cursor: crosshair; background: #3f2f22; }

  #waveBarContainer {
    width: 100%;
    height: 22px;
    margin-top: 8px;
    background: #241b12;
    border: 2px solid #5a4632;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  #waveBarFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ffd740, #ff9800);
    transition: width 0.1s linear, background-color 0.2s;
  }
  #waveBarLabel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #1b1206;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }

  #plantInfo {
    display: none;
    width: 100%;
    margin-top: 8px;
    padding: 6px 10px;
    background: #2c2419;
    border: 1px solid #5a4632;
    border-radius: 6px;
    font-size: 11px;
    color: #d7c8a0;
    line-height: 1.5;
  }
  #palette {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .palette-btn {
    position: relative;
    background: #2c2419;
    border: 2px solid #5a4632;
    border-radius: 8px;
    color: #f0e6d2;
    padding: 6px 2px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, transform 0.1s;
  }
  .palette-btn:hover { border-color: #e8c468; }
  .palette-btn.selected { border-color: #ffe066; background: #40361f; transform: translateY(-2px); }
  .palette-btn.disabled { opacity: 0.4; cursor: not-allowed; }
  .palette-btn .pname { font-weight: bold; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .palette-btn .pcost { font-size: 10px; color: #e8c468; }
  .palette-btn .plock { display: none; font-size: 9px; color: #ff8a65; }
  .palette-btn.locked .plock { display: block; }
  .palette-btn.locked .pcost { display: none; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; margin: 0 auto 3px; }

  #speedBtn {
    background: #40361f;
    border: 1px solid #5a4632;
    border-radius: 5px;
    color: #ffe066;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 10px;
    cursor: pointer;
  }
  #speedBtn:hover { border-color: #e8c468; }

  #tooltip {
    position: fixed;
    display: none;
    background: rgba(20,23,15,0.95);
    border: 2px solid #e8c468;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    z-index: 50;
    min-width: 140px;
    pointer-events: none;
  }
  #tooltip .tt-title { font-weight: bold; color: #ffe066; margin-bottom: 4px; }
  #tooltip .tt-warn { color: #ff8a65; font-size: 12px; margin-top: 4px; }
  #tooltip button {
    margin-top: 6px;
    background: #4caf50;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    pointer-events: auto;
  }
  #tooltip button:hover { background: #66bb6a; }

  #toast {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(20,23,15,0.94);
    border: 2px solid #ffd740;
    border-radius: 8px;
    padding: 10px 18px;
    z-index: 60;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast b { display: block; color: #ffd740; font-size: 15px; margin-bottom: 2px; }
  #toast span { font-size: 12px; color: #d7c8a0; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,8,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .overlay-box {
    background: #25361f;
    border: 2px solid #5a4632;
    border-radius: 10px;
    padding: 24px 30px;
    max-width: 420px;
    text-align: center;
  }
  .overlay-box h2 { color: #ffe066; margin-top: 0; }
  .overlay-box p { font-size: 14px; line-height: 1.7; text-align: left; }
  .overlay-box button {
    margin-top: 14px;
    background: #e8c468;
    border: none;
    color: #14170f;
    font-weight: bold;
    padding: 10px 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
  .overlay-box button:hover { background: #ffd97a; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="stat">所持金: <b id="moneyEl">¥0</b></span>
    <span class="stat">スコア: <b id="scoreEl">¥0</b></span>
    <span class="stat">ウェーブ: <b id="waveEl">0</b></span>
    <span class="stat" id="timerEl">-</span>
    <span class="stat" id="warnBadge">⚠ 植物残り0株</span>
    <button id="speedBtn" type="button">▶ 1x</button>
    <label id="debugToggle"><input type="checkbox" id="debugSmellChk"> 匂い場</label>
  </div>

  <div id="canvasWrap">
    <canvas id="game" width="482" height="482"></canvas>
  </div>

  <div id="waveBarContainer">
    <div id="waveBarFill"></div>
    <span id="waveBarLabel">-</span>
  </div>

  <div id="plantInfo"></div>

  <div id="palette"></div>
</div>

<div id="tooltip"></div>
<div id="toast"><b id="toastTitle"></b><span id="toastBody"></span></div>

<div class="overlay" id="instructionsOverlay">
  <div class="overlay-box">
    <h2>食虫植物タワーディフェンス</h2>
    <p>
      1. 空きマスをタップして植物を配置。イバラで迷路を作ろう<br>
      2. 蜜花が虫をおびき寄せ、食虫植物たちが迎え撃つ<br>
      3. 虫を食べて育った植物は売り時にタップ→売却で稼ごう<br>
      4. ウェーブが進むと新しい植物が解禁。7の倍数でボス来襲!
    </p>
    <p id="titleBest" style="text-align:center; color:#ffd740;"></p>
    <button id="startBtn">はじめる</button>
  </div>
</div>

<div class="overlay" id="gameOverOverlay" style="display:none;">
  <div class="overlay-box" id="gameOverBox">
    <h2>ゲームオーバー</h2>
    <p>畑の植物が食べ尽くされてしまった…</p>
    <p>最終スコア: ¥<span id="finalScoreEl">0</span><br>生存ウェーブ: <span id="finalWaveEl">0</span><br><span id="finalBestEl"></span></p>
    <button id="retryBtn">もう一度挑戦</button>
  </div>
</div>

const FW = CONFIG.grid.cols * CONFIG.grid.cell;
const FH = CONFIG.grid.rows * CONFIG.grid.cell;
const MARGIN = CONFIG.grid.margin;

let score = 0;

let bugs = [];
let projectiles = [];

let smellField = new Float32Array(CONFIG.grid.cols * CONFIG.grid.rows);

let selectedPlacementType = null;
let debugSmell = false;
let gameState = "ready"; // ready | playing | gameover
let lastTooltipUpdate = 0;

function makeGrid(){
  return Array.from({length: CONFIG.grid.rows}, () => Array(CONFIG.grid.cols).fill(null));
}
function clampNum(v, a, b){ return Math.max(a, Math.min(b, v)); }

// ---------- Plants ----------
function createPlant(type, gx, gy){
  const def = CONFIG.plants[type];
  return {
    type, gx, gy,
    x: gx * CONFIG.grid.cell + CONFIG.grid.cell / 2,
    y: gy * CONFIG.grid.cell + CONFIG.grid.cell / 2,
    hp: def.maxHp, maxHp: def.maxHp,
    plantedAt: performance.now(),
    stage: 0, eatCount: 0, bloated: false,
    chewTimer: 0, eatAnim: 0, lastAttack: 0,
    lastStandBuffed: false, aimAngle: -Math.PI / 2
  };
}

function isRooted(p){
  return (performance.now() - p.plantedAt) < CONFIG.root.time * 1000;
}

function plantRadius(p){
  return CONFIG.grid.cell * 0.3 + (p.stage || 0) * 2;
}

function plantSellValue(p){
  const def = CONFIG.plants[p.type];
  if (def.sell){ // 時間経過で売値が変わる植物(蜜花)
    const t = (performance.now() - p.plantedAt) / 1000;
    const s = def.sell;
    if (t <= s.peakTime) return Math.round(s.base + (s.peak - s.base) * (t / s.peakTime));
    const dt = t - s.peakTime;
    return Math.round(s.peak - (s.peak - s.floor) * Math.min(1, dt / s.declineDuration));
  }
  if (def.sellFlat != null) return def.sellFlat;
  return def.sellByStage[p.stage];
}

function updatePlantGrowth(p){
  const def = CONFIG.plants[p.type];
  if (!def.growth) return;
  if (p.stage < 1 && p.eatCount >= def.growth.toStage1) p.stage = 1;
  if (p.stage < 2 && p.eatCount >= def.growth.toStage2) p.stage = 2;
  if (p.stage >= 2 && p.eatCount >= def.growth.toStage2 + def.growth.overfeedBloat) p.bloated = true;
}

// 時間で成長する植物(ラベンダー)の段階更新。update()から毎フレーム呼ぶ
function updateTimedGrowth(p){
  const def = CONFIG.plants[p.type];
  if (!def.growthByTime) return;
  const t = (performance.now() - p.plantedAt) / 1000;
  if (p.stage < 1 && t >= def.growthByTime[0]) p.stage = 1;
  if (p.stage < 2 && t >= def.growthByTime[1]) p.stage = 2;
}

// 隣接8マスのラベンダーによる攻撃力倍率
function boostMultiplier(p){
  let mult = 1;
  for (let dy = -1; dy <= 1; dy++){
    for (let dx = -1; dx <= 1; dx++){
      if (dx === 0 && dy === 0) continue;
      const nx = p.gx + dx, ny = p.gy + dy;
      if (nx < 0 || ny < 0 || nx >= CONFIG.grid.cols || ny >= CONFIG.grid.rows) continue;
      const nb = plantGrid[ny][nx];
      if (nb && nb.type === "lavender" && !isRooted(nb)){
        const boost = CONFIG.plants.lavender.boostByStage[nb.stage];
        mult *= boost;
      }
    }
  }
  return Math.min(mult, 4); // DTD同様、最大4倍で頭打ち
}

function predationStats(p){
  const def = CONFIG.plants[p.type];
  if (!def.predation) return null;
  const base = Array.isArray(def.predation) ? def.predation[p.stage] : def.predation;
  const interval = p.bloated && def.bloatMult ? base.interval * def.bloatMult : base.interval;
  return {
    dmg: base.dmg * boostMultiplier(p),
    interval, range: base.range, aoe: def.aoe,
    projectile: !!def.projectile, projectileSpeed: def.projectileSpeed, aoeRadius: def.aoeRadius,
    airOnly: !!def.airOnly, multi: def.multi || 1,
    slow: def.slowByStage ? def.slowByStage[p.stage] : null,
    poison: def.poisonByStage ? def.poisonByStage[p.stage] : null,
    stun: def.stunByStage ? def.stunByStage[p.stage] : null
  };
}

function tryPlacePlant(type, gx, gy){
  if (gameState !== "playing") return false;
  const def = CONFIG.plants[type];
  if (waveManager.waveNumber < (def.unlockWave || 0)) return false;
  if (money < def.cost) return false;
  if (plantGrid[gy][gx]) return false;
  money -= def.cost;
  const p = createPlant(type, gx, gy);
  plantGrid[gy][gx] = p;
  plants.push(p);
  recomputeSmellField();
  plantingEffects.push({ x: p.x, y: p.y, timer: 0.7, maxTimer: 0.7 });
  return true;
}

function sellPlant(p){
  if (isRooted(p)) return false;
  const val = plantSellValue(p);
  money += val;
  score += val;
  plantGrid[p.gy][p.gx] = null;
  plants = plants.filter(x => x !== p);
  recomputeSmellField();
  if (selectedPlant === p) selectedPlant = null;
  plantingEffects.push({ x: p.x, y: p.y, timer: 0.7, maxTimer: 0.7 });
  playSellSound();
  return true;
}

function handlePlantDestroyed(plant, bug){
  plantGrid[plant.gy][plant.gx] = null;
  plants = plants.filter(p => p !== plant);
  if (selectedPlant === plant) hideTooltip();
  recomputeSmellField();
  const def = CONFIG.bugs[bug.type];
  const newMax = (bug.maxHp || bug.hp) * def.growth.hp;
  bug.hp = Math.min(bug.hp * def.growth.hp, newMax);
  bug.maxHp = newMax;
  bug.speed *= def.growth.speed;
  bug.size *= def.growth.size;
  bug.feedCount = (bug.feedCount || 0) + 1;
  bug.target = null;
}

// ---------- Smell field ----------
function recomputeSmellField(){
  const { cols, rows } = CONFIG.grid;
  smellField.fill(0);
  for (const p of plants){
    const S = CONFIG.plants[p.type].smell;
    if (S <= 0) continue;
    const radius = Math.min(Math.max(cols, rows), Math.ceil(Math.sqrt(S / CONFIG.smell.falloffK) / 3) + 2);
    for (let dy = -radius; dy <= radius; dy++){
      for (let dx = -radius; dx <= radius; dx++){
        const nx = p.gx + dx, ny = p.gy + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const dist2 = dx * dx + dy * dy;
        const contribution = S / (1 + dist2 * CONFIG.smell.falloffK);
        if (contribution < CONFIG.smell.minContribution) continue;
        smellField[ny * cols + nx] += contribution;
      }
    }
  }
}

// ---------- Bugs ----------
function edgeSpawnFor(type){
  const edge = CONFIG.bugs[type].spawnEdge;
  if (edge === "top") return { x: Math.random() * FW, y: -MARGIN };
  if (edge === "right") return { x: FW + MARGIN, y: Math.random() * FH };
  if (edge === "bottom") return { x: Math.random() * FW, y: FH + MARGIN };
  return { x: -MARGIN, y: Math.random() * FH };
}

function waveMultipliers(w){
  const easy = w <= CONFIG.waves.easyWaves ? CONFIG.waves.easyMultiplier : 1;
  return {
    hp: 1 + (w - 1) * CONFIG.waves.hpGrowthPerWave * easy,
    speed: 1 + (w - 1) * CONFIG.waves.speedGrowthPerWave * easy,
    dmg: 1 + (w - 1) * CONFIG.waves.dmgGrowthPerWave * easy
  };
}

function createBug(type, pos, mult){
  const def = CONFIG.bugs[type];
  const hp = def.hp * mult.hp;
  return {
    type, x: pos.x, y: pos.y, hp, maxHp: hp,
    speed: def.speed * mult.speed,
    biteDmg: def.biteDmg * mult.dmg,
    biteInterval: def.biteInterval,
    size: def.size,
    armor: def.armor || 0,
    splitsLeft: def.splitOnDeath || 0,
    slowUntil: 0, slowFactor: 1, stunUntil: 0,
    poison: null,
    feedCount: 0, target: null, lastBite: 0, dead: false,
    wanderAngle: Math.random() * Math.PI * 2
  };
}

function isStunned(bug){
  return performance.now() < bug.stunUntil;
}

function effectiveSpeed(bug){
  const slowed = performance.now() < bug.slowUntil;
  return bug.speed * (slowed ? bug.slowFactor : 1);
}

function moveToward(bug, tx, ty, dt){
  const dx = tx - bug.x, dy = ty - bug.y;
  const d = Math.hypot(dx, dy) || 1;
  const step = effectiveSpeed(bug) * dt;
  const s = Math.min(step, d);
  bug.x += (dx / d) * s;
  bug.y += (dy / d) * s;
}

function findNearestPlant(bug){
  let best = null, bestD = Infinity;
  for (const p of plants){
    const d = Math.hypot(p.x - bug.x, p.y - bug.y);
    if (d < bestD){ bestD = d; best = p; }
  }
  return best;
}

// 捕食による成長分裂(植物を食べきった時)
function splitBug(bug, newBugs){
  const half = Math.max(4, Math.floor(bug.hp / 2));
  for (let i = 0; i < 2; i++){
    newBugs.push(Object.assign({}, bug, {
      hp: half, maxHp: half,
      size: bug.size * 0.8,
      poison: null, slowUntil: 0, stunUntil: 0,
      feedCount: 0, target: null, lastBite: 0, dead: false,
      x: clampNum(bug.x + (Math.random() - 0.5) * 24, -MARGIN, FW + MARGIN),
      y: clampNum(bug.y + (Math.random() - 0.5) * 24, -MARGIN, FH + MARGIN),
      wanderAngle: Math.random() * Math.PI * 2
    }));
  }
  bug.dead = true;
}

// 全ダメージの入口。装甲・死亡・分裂(ミノムシ)・捕食カウントを一元処理
function damageBug(bug, rawDmg, sourcePlant){
  if (bug.dead || bug.hp <= 0) return false;
  const dmg = Math.max(1, rawDmg - bug.armor);
  bug.hp -= dmg;
  if (bug.hp > 0) return false;
  bug.dead = true;
  if (bug.splitsLeft > 0){
    // 倒すと2匹に分裂(体力は元の半分・分裂回数を1消費)
    const childHp = Math.max(3, Math.floor(bug.maxHp / 2));
    for (let i = 0; i < 2; i++){
      const child = Object.assign({}, bug, {
        hp: childHp, maxHp: childHp,
        size: bug.size * 0.85,
        splitsLeft: bug.splitsLeft - 1,
        poison: null, slowUntil: 0, stunUntil: 0,
        target: null, lastBite: 0, dead: false,
        x: clampNum(bug.x + (Math.random() - 0.5) * 20, -MARGIN, FW + MARGIN),
        y: clampNum(bug.y + (Math.random() - 0.5) * 20, -MARGIN, FH + MARGIN),
        wanderAngle: Math.random() * Math.PI * 2
      });
      pendingBugs.push(child);
    }
  }
  if (sourcePlant && plantGrid[sourcePlant.gy] && plantGrid[sourcePlant.gy][sourcePlant.gx] === sourcePlant){
    sourcePlant.eatCount = (sourcePlant.eatCount || 0) + 1;
    updatePlantGrowth(sourcePlant);
  }
  return true;
}

function applySlow(bug, slow){
  if (CONFIG.bugs[bug.type].slowImmune) return;
  bug.slowUntil = performance.now() + slow.duration * 1000;
  bug.slowFactor = slow.factor;
}

function applyPoison(bug, poison, sourcePlant){
  bug.poison = { dps: poison.dps, until: performance.now() + poison.duration * 1000, src: sourcePlant };
}

function applyStun(bug, stun){
  bug.stunUntil = performance.now() + stun.duration * 1000;
}

// ---------- Fence (grounded bugs only cross at the 4 gate openings) ----------
function insideFarm(x, y){
  return x >= 0 && x < FW && y >= 0 && y < FH;
}

function fenceGateSpan(){
  const cell = CONFIG.grid.cell;
  return [3 * cell, 6 * cell];
}

function crossedThroughGate(px, py, nx, ny){
  const [g0, g1] = fenceGateSpan();
  function crossOk(pa, na, pb, nb, boundary, lo, hi){
    if ((pa < boundary) === (na < boundary)) return true; // didn't cross this line
    const t = (boundary - pa) / (na - pa);
    const at = pb + (nb - pb) * t;
    return at >= lo && at <= hi;
  }
  if (!crossOk(px, nx, py, ny, 0, g0, g1)) return false;   // left edge
  if (!crossOk(px, nx, py, ny, FW, g0, g1)) return false;  // right edge
  if (!crossOk(py, ny, px, nx, 0, g0, g1)) return false;   // top edge
  if (!crossOk(py, ny, px, nx, FH, g0, g1)) return false;  // bottom edge
  return true;
}

function enforceFence(bug, px, py){
  if (insideFarm(px, py) === insideFarm(bug.x, bug.y)) return;
  if (crossedThroughGate(px, py, bug.x, bug.y)) return;
  bug.x = px;
  bug.y = py;
}

function gateWaypoint(bug){
  const cell = CONFIG.grid.cell;
  const mid = FW / 2;
  const gates = [
    { ox: mid, oy: -14, ix: mid, iy: cell * 0.6 },
    { ox: mid, oy: FH + 14, ix: mid, iy: FH - cell * 0.6 },
    { ox: -14, oy: mid, ix: cell * 0.6, iy: mid },
    { ox: FW + 14, oy: mid, ix: FW - cell * 0.6, iy: mid }
  ];
  let best = null, bestD = Infinity;
  for (const g of gates){
    const d = Math.hypot(g.ox - bug.x, g.oy - bug.y);
    if (d < bestD){ bestD = d; best = g; }
  }
  // Within 30px of the gate mouth, commit to the inside point (30 > the
  // 14px mouth offset, so the target can't flip back and oscillate).
  return bestD < 30 ? { x: best.ix, y: best.iy } : { x: best.ox, y: best.oy };
}

function updateBug(bug, dt, newBugs){
  if (isStunned(bug)) return; // 麻痺中は移動も噛みつきもしない
  const def = CONFIG.bugs[bug.type];
  const fenced = !def.flying && !def.ignoreFence; // バッタは柵を飛び越える
  if (fenced && !insideFarm(bug.x, bug.y)){
    const px = bug.x, py = bug.y;
    const wp = gateWaypoint(bug);
    moveToward(bug, wp.x, wp.y, dt);
    enforceFence(bug, px, py);
    return;
  }
  const px = bug.x, py = bug.y;
  updateBugCore(bug, dt, newBugs);
  if (fenced) enforceFence(bug, px, py);
}

function updateBugCore(bug, dt, newBugs){
  const { cell, cols, rows } = CONFIG.grid;

  if (bug.target){
    const t = bug.target;
    if (t.hp <= 0 || plantGrid[t.gy][t.gx] !== t){
      bug.target = null;
    } else {
      const d = Math.hypot(t.x - bug.x, t.y - bug.y);
      const atkRange = bug.size + plantRadius(t) + 3;
      if (d <= atkRange){
        const now = performance.now();
        if (now - bug.lastBite >= bug.biteInterval * 1000){
          bug.lastBite = now;
          const dmg = bug.biteDmg * (isRooted(t) ? CONFIG.root.dmgMult : 1);
          t.hp -= dmg;
          t.chewTimer = 0.3;
          if (t.hp <= 0){
            handlePlantDestroyed(t, bug);
            const def = CONFIG.bugs[bug.type];
            if (bug.feedCount >= def.feedThreshold) splitBug(bug, newBugs);
          }
        }
        return;
      } else {
        moveToward(bug, t.x, t.y, dt);
        return;
      }
    }
  }

  const gx = clampNum(Math.floor(bug.x / cell), 0, cols - 1);
  const gy = clampNum(Math.floor(bug.y / cell), 0, rows - 1);
  let best = null, bestVal = -Infinity, maxRaw = 0;
  for (let dy = -1; dy <= 1; dy++){
    for (let dx = -1; dx <= 1; dx++){
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const raw = smellField[ny * cols + nx];
      if (raw > maxRaw) maxRaw = raw;
      const val = raw + (Math.random() - 0.5) * CONFIG.smell.jitter;
      if (val > bestVal){ bestVal = val; best = { nx, ny }; }
    }
  }
  if (!best || maxRaw <= 0.05){
    const nearest = findNearestPlant(bug);
    if (nearest){
      const d = Math.hypot(nearest.x - bug.x, nearest.y - bug.y);
      if (d <= bug.size + plantRadius(nearest) + cell * 0.5){
        bug.target = nearest;
        return;
      }
      moveToward(bug, nearest.x, nearest.y, dt);
      bug.x = clampNum(bug.x, -MARGIN, FW + MARGIN);
      bug.y = clampNum(bug.y, -MARGIN, FH + MARGIN);
      return;
    }
    if (Math.random() < 0.02) bug.wanderAngle = Math.random() * Math.PI * 2;
    bug.x += Math.cos(bug.wanderAngle) * effectiveSpeed(bug) * dt * 0.5;
    bug.y += Math.sin(bug.wanderAngle) * effectiveSpeed(bug) * dt * 0.5;
    bug.x = clampNum(bug.x, -MARGIN, FW + MARGIN);
    bug.y = clampNum(bug.y, -MARGIN, FH + MARGIN);
    return;
  }
  const tx = best.nx * cell + cell / 2, ty = best.ny * cell + cell / 2;
  const occ = plantGrid[best.ny][best.nx];
  if (occ && occ.hp > 0){
    const d = Math.hypot(occ.x - bug.x, occ.y - bug.y);
    if (d <= bug.size + plantRadius(occ) + cell * 0.5){
      bug.target = occ;
      return;
    }
  }
  moveToward(bug, tx, ty, dt);
  bug.x = clampNum(bug.x, -MARGIN, FW + MARGIN);
  bug.y = clampNum(bug.y, -MARGIN, FH + MARGIN);
}

// ---------- Predation ----------
function triggerMine(p, def){
  const m = def.mine;
  const trigger = bugs.some(b => !b.dead && Math.hypot(b.x - p.x, b.y - p.y) <= m.triggerRange);
  if (!trigger) return;
  playMineSound();
  rangeEffects.push({ x: p.x, y: p.y, range: m.blastRange, color: "#ff7043", timer: 0.45, maxTimer: 0.45 });
  bugs.forEach(b => {
    if (!b.dead && Math.hypot(b.x - p.x, b.y - p.y) <= m.blastRange) damageBug(b, m.dmg, null);
  });
  // 一回限り: 爆発したら消滅(売却不可の消耗品)
  plantGrid[p.gy][p.gx] = null;
  plants = plants.filter(x => x !== p);
  if (selectedPlant === p) hideTooltip();
  recomputeSmellField();
}

function runPredation(){
  const now = performance.now();
  for (const p of plants.slice()){
    const def = CONFIG.plants[p.type];
    if (def.mine){
      if (!isRooted(p)) triggerMine(p, def);
      continue;
    }
    const stats = predationStats(p);
    if (!stats) continue; // 蜜花・ラベンダーは攻撃しない
    if (now - p.lastAttack < stats.interval * 1000) continue;
    let inRange = bugs.filter(b => !b.dead && Math.hypot(b.x - p.x, b.y - p.y) <= stats.range);
    if (stats.airOnly) inRange = inRange.filter(b => CONFIG.bugs[b.type].flying);
    if (inRange.length === 0) continue;
    p.lastAttack = now;
    p.eatAnim = 0.25;
    inRange.sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
    const target = inRange[0];
    if (stats.projectile){
      const angle = Math.atan2(target.y - p.y, target.x - p.x);
      p.aimAngle = angle;
      if (p.type === "orchid") playSniperSound(); else playFireSound();
      projectiles.push({
        x: p.x, y: p.y,
        targetX: target.x, targetY: target.y,
        angle,
        speed: stats.projectileSpeed,
        dmg: stats.dmg,
        aoeRadius: stats.aoeRadius,
        sourcePlant: p,
        dead: false
      });
    } else if (stats.aoe){
      if (p.type === "pitcher") playPitcherSound();
      rangeEffects.push({ x: p.x, y: p.y, range: stats.range, color: def.color, timer: 0.4, maxTimer: 0.4 });
      inRange.forEach(b => {
        if (stats.slow) applySlow(b, stats.slow);
        if (stats.stun) applyStun(b, stats.stun);
        damageBug(b, stats.dmg, p);
      });
    } else {
      // 単体攻撃(multi指定があれば近い順に複数体)
      const targets = inRange.slice(0, stats.multi);
      targets.forEach(b => {
        if (stats.slow) applySlow(b, stats.slow);
        if (stats.poison) applyPoison(b, stats.poison, p);
        damageBug(b, stats.dmg, p);
      });
      // 対空タンポポの攻撃線演出用
      if (stats.multi > 1){
        targets.forEach(b => {
          rangeEffects.push({ x: p.x, y: p.y, lineTo: { x: b.x, y: b.y }, color: def.color, timer: 0.18, maxTimer: 0.18 });
        });
      }
    }
  }
}

// ---------- Projectiles ----------
function updateProjectiles(dt){
  for (const proj of projectiles){
    if (proj.dead) continue;
    const dx = proj.targetX - proj.x, dy = proj.targetY - proj.y;
    const dist = Math.hypot(dx, dy);
    const step = proj.speed * dt;
    if (step >= dist){
      proj.x = proj.targetX;
      proj.y = proj.targetY;
      explodeProjectile(proj);
      proj.dead = true;
    } else {
      proj.x += (dx / dist) * step;
      proj.y += (dy / dist) * step;
    }
  }
  projectiles = projectiles.filter(p => !p.dead);
}

function updatePlantingEffects(dt){
  plantingEffects.forEach(e => {
    const prevElapsed = e.maxTimer - e.timer;
    e.timer -= dt;
    const elapsed = e.maxTimer - e.timer;
    for (let i = 0; i < HOE_SWINGS; i++){
      const hitTime = (e.maxTimer / HOE_SWINGS) * (i + 0.5);
      if (prevElapsed < hitTime && elapsed >= hitTime){
        playHoeSound();
      }
    }
  });
  plantingEffects = plantingEffects.filter(e => e.timer > 0);
}

function updateRangeEffects(dt){
  rangeEffects.forEach(e => { e.timer -= dt; });
  rangeEffects = rangeEffects.filter(e => e.timer > 0);
}

function explodeProjectile(proj){
  const sp = proj.sourcePlant;
  const src = (sp && plantGrid[sp.gy] && plantGrid[sp.gy][sp.gx] === sp) ? sp : null;
  bugs.forEach(b => {
    if (!b.dead && Math.hypot(b.x - proj.x, b.y - proj.y) <= proj.aoeRadius){
      damageBug(b, proj.dmg, src);
    }
  });
}

// ---------- Wave manager ----------
// DTD式: 7ウェーブごとにボス。各ウェーブはテーマ種族(70%)+混合(30%)。
// Waves trigger on a fixed schedule (cycleTimer) regardless of whether the
// previous wave's bugs have been cleared; unspawned backlog carries over.
function unlockedSpecies(w){
  return Object.keys(CONFIG.bugs).filter(t => t !== "boss" && w >= CONFIG.bugs[t].waveStart);
}

function isBossWave(w){
  return w > 0 && w % CONFIG.waves.bossEvery === 0;
}

// ウェーブwのテーマ種族(決定的: 予告と実際が一致する)
function themeFor(w){
  if (isBossWave(w)) return "boss";
  const pool = unlockedSpecies(w);
  return pool[(w - 1) % pool.length];
}

function pickWeighted(pool){
  const total = pool.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of pool){
    r -= p.weight;
    if (r <= 0) return p.type;
  }
  return pool[0].type;
}

const waveManager = {
  waveNumber: 0,
  cycleTimer: CONFIG.waves.prepTimeBase,
  cycleDuration: CONFIG.waves.prepTimeBase,
  spawning: false,
  spawnedCount: 0,
  totalToSpawn: 0,
  spawnTimer: 0,
  bossPending: false,
  seenSpecies: {},
  update(dt){
    if (gameState !== "playing") return;
    if (this.spawning){
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && this.spawnedCount < this.totalToSpawn){
        this.doSpawn();
        this.spawnedCount++;
        this.spawnTimer = CONFIG.waves.spawnInterval;
      }
      if (this.spawnedCount >= this.totalToSpawn) this.spawning = false;
    }
    this.cycleTimer -= dt;
    if (this.cycleTimer <= 0) this.startWave();
  },
  startWave(){
    this.waveNumber++;
    const w = this.waveNumber;
    // 新しく解禁された植物を通知
    const unlocked = Object.keys(CONFIG.plants).filter(t => (CONFIG.plants[t].unlockWave || 0) === w);
    if (unlocked.length){
      showToast("新しい植物が解禁: " + unlocked.map(t => CONFIG.plants[t].label).join("・"), "");
      updatePaletteHighlight();
    }
    const easy = w <= CONFIG.waves.easyWaves ? CONFIG.waves.easyMultiplier : 1;
    if (isBossWave(w)){
      // ボスウェーブ: ボス1体 + 少数の随伴
      this.bossPending = true;
      this.totalToSpawn = this.spawnedCount + 4;
      playBossSound();
    } else {
      const newCount = Math.max(3, Math.round((CONFIG.waves.countBase + (w - 1) * CONFIG.waves.countGrowthPerWave) * easy));
      this.totalToSpawn = this.spawnedCount + newCount;
      playWaveStartSound();
    }
    this.spawnTimer = 0;
    this.spawning = true;
    const prepTime = Math.max(CONFIG.waves.prepTimeMin, CONFIG.waves.prepTimeBase - w * CONFIG.waves.prepTimeDecayPerWave);
    this.cycleDuration = prepTime;
    this.cycleTimer = prepTime;
  },
  spawnOne(type, mult){
    const def = CONFIG.bugs[type];
    if (!this.seenSpecies[type]){
      this.seenSpecies[type] = true;
      showToast("新しい敵: " + def.label + "!", def.intro || "");
    }
    // burst種(アリ/イナゴ)は1回の出現でまとめて湧く
    const n = def.burst || 1;
    for (let i = 0; i < n; i++){
      const pos = edgeSpawnFor(type);
      pos.x += (Math.random() - 0.5) * 26;
      pos.y += (Math.random() - 0.5) * 26;
      bugs.push(createBug(type, pos, mult));
    }
  },
  doSpawn(){
    const w = this.waveNumber;
    const mult = waveMultipliers(w);
    if (this.bossPending){
      // ウェーブ先頭にボスを1体投入
      this.bossPending = false;
      const bossMult = {
        hp: mult.hp * (1 + w * CONFIG.waves.bossHpWaveMult),
        speed: mult.speed,
        dmg: mult.dmg
      };
      if (!this.seenSpecies.boss){
        this.seenSpecies.boss = true;
        showToast("ヌシカブト出現!!", CONFIG.bugs.boss.intro);
      }
      bugs.push(createBug("boss", edgeSpawnFor("boss"), bossMult));
      return;
    }
    const theme = themeFor(w);
    if (theme !== "boss" && Math.random() < CONFIG.waves.themeRatio){
      this.spawnOne(theme, mult);
      return;
    }
    const pool = unlockedSpecies(w).map(t => ({ type: t, weight: CONFIG.bugs[t].weight }));
    this.spawnOne(pickWeighted(pool), mult);
  }
};

// ---------- Game state checks ----------
function checkLastStand(){
  if (plants.length >= 2) everHadMultiplePlants = true;
  if (plants.length === 1 && everHadMultiplePlants){
    const p = plants[0];
    if (!p.lastStandBuffed){
      p.maxHp *= CONFIG.warning.lastStandHpMult;
      p.hp *= CONFIG.warning.lastStandHpMult;
      p.lastStandBuffed = true;
    }
  }
}
function checkLoss(){
  if (gameState === "playing" && bugs.length > 0 && plants.length === 0){
    triggerGameOver();
  }
}
function loadHighScore(){
  try { return parseInt(localStorage.getItem("cptd_highscore") || "0", 10) || 0; }
  catch (e) { return 0; }
}
function saveHighScore(v){
  try { localStorage.setItem("cptd_highscore", String(v)); } catch (e) {}
}

function triggerGameOver(){
  gameState = "gameover";
  const finalScore = Math.floor(score);
  document.getElementById("finalScoreEl").textContent = finalScore;
  document.getElementById("finalWaveEl").textContent = waveManager.waveNumber;
  const best = loadHighScore();
  const bestEl = document.getElementById("finalBestEl");
  if (finalScore > best){
    saveHighScore(finalScore);
    bestEl.textContent = "ハイスコア更新! ¥" + finalScore;
  } else {
    bestEl.textContent = "ベスト: ¥" + best;
  }
  gameOverEl.style.display = "flex";
}

// 毒(継続ダメージ)のティック処理
function tickPoison(dt){
  const now = performance.now();
  for (const b of bugs){
    if (b.dead || !b.poison) continue;
    if (now >= b.poison.until){ b.poison = null; continue; }
    const src = b.poison.src;
    const validSrc = (src && plantGrid[src.gy] && plantGrid[src.gy][src.gx] === src) ? src : null;
    // 毒は装甲を貫通する(damageBugを通すと最低1保証で二重補正になるため直接)
    b.hp -= b.poison.dps * dt;
    if (b.hp <= 0 && !b.dead){
      b.hp = 0.01; // damageBugの死亡処理(分裂・捕食カウント)に載せるため僅かに残す
      damageBug(b, 999, validSrc);
    }
  }
}

// ---------- Main update ----------
function update(dt){
  waveManager.update(dt);
  for (const p of plants){
    if (p.chewTimer > 0) p.chewTimer = Math.max(0, p.chewTimer - dt);
    if (p.eatAnim > 0) p.eatAnim = Math.max(0, p.eatAnim - dt);
    updateTimedGrowth(p);
  }
  runPredation();
  tickPoison(dt);
  const newBugs = [];
  for (const b of bugs){
    if (b.dead) continue;
    updateBug(b, dt, newBugs);
  }
  bugs = bugs.filter(b => !b.dead && b.hp > 0).concat(newBugs, pendingBugs);
  pendingBugs = [];
  updateProjectiles(dt);
  updatePlantingEffects(dt);
  updateRangeEffects(dt);
  checkLastStand();
  checkLoss();
}

// ---------- Rendering ----------
// Scenery decorations live in the margin band around the farm (farm-local
// coords: x,y in [-MARGIN, 0) or [FW/FH, FW/FH+MARGIN)). Visual only.
const SCENERY = {
  trees: [
    { x: FW * 0.18, y: -36, r: 13 }, { x: FW * 0.47, y: -40, r: 16 }, { x: FW * 0.78, y: -33, r: 12 },
    { x: -36, y: FH * 0.18, r: 14 }, { x: -32, y: FH * 0.51, r: 12 }, { x: -38, y: FH * 0.86, r: 15 },
    { x: FW + 36, y: FH * 0.15, r: 13 }, { x: FW + 32, y: FH * 0.48, r: 15 }, { x: FW + 38, y: FH * 0.82, r: 12 },
    { x: FW * 0.13, y: FH + 36, r: 13 }, { x: FW * 0.44, y: FH + 40, r: 12 }, { x: FW * 0.75, y: FH + 35, r: 15 }
  ],
  rocks: [
    { x: FW + 6, y: FH * 0.2, rx: 6, ry: 4 }, { x: FW + 9, y: FH * 0.55, rx: 5, ry: 3.5 }, { x: FW + 5, y: FH * 0.88, rx: 7, ry: 4.5 }
  ],
  grass: [
    { x: FW * 0.06, y: -20 }, { x: FW * 0.32, y: -55 }, { x: FW * 0.63, y: -18 }, { x: FW * 0.94, y: -48 },
    { x: -20, y: FH * 0.07 }, { x: -52, y: FH * 0.38 }, { x: -18, y: FH * 0.7 }, { x: -50, y: FH * 0.99 },
    { x: FW * 0.04, y: FH + 23 }, { x: FW * 0.29, y: FH + 58 }, { x: FW * 0.58, y: FH + 20 }, { x: FW * 0.88, y: FH + 60 }
  ]
};

function drawTree(x, y, r){
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(x - 2, y, 4, r * 0.9);
  ctx.fillStyle = "#3e7d3a";
  ctx.beginPath(); ctx.arc(x, y - r * 0.2, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4f9447";
  ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.45, r * 0.55, 0, Math.PI * 2); ctx.fill();
}

function drawHut(cx, cy){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = "#8d6e4f";
  ctx.fillRect(-20, -8, 40, 24);
  ctx.fillStyle = "#a33b2e";
  ctx.beginPath();
  ctx.moveTo(-24, -8); ctx.lineTo(0, -27); ctx.lineTo(24, -8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5b4632";
  ctx.fillRect(-5, 3, 10, 13);
  ctx.fillStyle = "#ffe9a8";
  ctx.fillRect(8, 0, 8, 8);
  ctx.strokeStyle = "#3d2f21";
  ctx.lineWidth = 1;
  ctx.strokeRect(8, 0, 8, 8);
  ctx.restore();
}

function drawScenery(){
  SCENERY.rocks.forEach(rk => {
    ctx.fillStyle = "#9e9e9e";
    ctx.beginPath(); ctx.ellipse(rk.x, rk.y, rk.rx, rk.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#bdbdbd";
    ctx.beginPath(); ctx.ellipse(rk.x - rk.rx * 0.3, rk.y - rk.ry * 0.3, rk.rx * 0.4, rk.ry * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.strokeStyle = "#6a8f3c";
  ctx.lineWidth = 1.5;
  SCENERY.grass.forEach(g => {
    ctx.beginPath();
    ctx.moveTo(g.x - 3, g.y + 4); ctx.lineTo(g.x - 1, g.y - 3);
    ctx.moveTo(g.x, g.y + 4); ctx.lineTo(g.x, g.y - 5);
    ctx.moveTo(g.x + 3, g.y + 4); ctx.lineTo(g.x + 1, g.y - 3);
    ctx.stroke();
  });
  drawHut(-36, -32);
  SCENERY.trees.forEach(tr => drawTree(tr.x, tr.y, tr.r));
}

function drawBackground(){
  const { cols, rows, cell } = CONFIG.grid;
  ctx.fillStyle = "#4a382a";
  ctx.fillRect(0, 0, cols * cell, rows * cell);
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= cols; gx++){
    ctx.beginPath(); ctx.moveTo(gx * cell, 0); ctx.lineTo(gx * cell, rows * cell); ctx.stroke();
  }
  for (let gy = 0; gy <= rows; gy++){
    ctx.beginPath(); ctx.moveTo(0, gy * cell); ctx.lineTo(cols * cell, gy * cell); ctx.stroke();
  }
}

// White fence around the farm perimeter, with an opening at the center
// 3 cells of each side. Visual only — bugs pass through freely.
function drawFence(){
  const cell = CONFIG.grid.cell;
  const off = 8;
  const gapStart = 3 * cell, gapEnd = 6 * cell;
  function seg(x1, y1, x2, y2){
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x1, y1 + 1); ctx.lineTo(x2, y2 + 1); ctx.stroke();
    ctx.strokeStyle = "#f2f2ea";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const len = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(1, Math.round(len / (cell / 2)));
    for (let i = 0; i <= n; i++){
      const px = x1 + (x2 - x1) * i / n;
      const py = y1 + (y2 - y1) * i / n;
      ctx.fillStyle = "#f2f2ea";
      ctx.fillRect(px - 2.5, py - 2.5, 5, 5);
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1;
      ctx.strokeRect(px - 2.5, py - 2.5, 5, 5);
    }
  }
  // top
  seg(-off, -off, gapStart, -off);
  seg(gapEnd, -off, FW + off, -off);
  // bottom
  seg(-off, FH + off, gapStart, FH + off);
  seg(gapEnd, FH + off, FW + off, FH + off);
  // left
  seg(-off, -off, -off, gapStart);
  seg(-off, gapEnd, -off, FH + off);
  // right
  seg(FW + off, -off, FW + off, gapStart);
  seg(FW + off, gapEnd, FW + off, FH + off);
}

function drawSmellHeatmap(){
  const { cols, rows, cell } = CONFIG.grid;
  for (let gy = 0; gy < rows; gy++){
    for (let gx = 0; gx < cols; gx++){
      const v = smellField[gy * cols + gx];
      if (v <= 0.5) continue;
      const t = Math.min(1, v / 120);
      const r = Math.round(255 * t), b = Math.round(255 * (1 - t));
      ctx.fillStyle = `rgba(${r},80,${b},0.45)`;
      ctx.fillRect(gx * cell, gy * cell, cell, cell);
    }
  }
}

function isAtPeakValue(p){
  const def = CONFIG.plants[p.type];
  if (def.sell){
    return plantSellValue(p) >= def.sell.peak * CONFIG.economy.peakValueThreshold;
  }
  if (def.growth || def.growthByTime){
    return p.stage === 2;
  }
  return false;
}

function drawPeakTileBorder(p){
  const cell = CONFIG.grid.cell;
  const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 200);
  ctx.strokeStyle = `rgba(255, 215, 0, ${pulse})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(-cell / 2 + 2, -cell / 2 + 2, cell - 4, cell - 4);
}

function drawPlant(p){
  const def = CONFIG.plants[p.type];
  let sx = 0, sy = 0;
  if (p.chewTimer > 0){ sx = (Math.random() - 0.5) * 4; sy = (Math.random() - 0.5) * 4; }
  ctx.save();
  ctx.translate(p.x + sx, p.y + sy);

  if (p.type === "mitsubana"){
    const t = (performance.now() - p.plantedAt) / 1000;
    const bloom = Math.min(1, t / def.sell.peakTime);
    const R = 6 + bloom * 7;
    for (let i = 0; i < 6; i++){
      const a = (Math.PI * 2 / 6) * i;
      ctx.beginPath();
      ctx.fillStyle = def.color;
      ctx.ellipse(Math.cos(a) * R * 0.7, Math.sin(a) * R * 0.7, R * 0.6, R * 0.35, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = "#ffe066"; ctx.arc(0, 0, R * 0.45, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "flytrap"){
    const bodyColor = p.bloated ? "#6b6b4a" : ["#8bc34a", "#4caf50", "#2e7d32"][p.stage];
    const angle = p.aimAngle != null ? p.aimAngle : -Math.PI / 2;
    const barrelLen = 11 + p.stage * 3;
    ctx.fillStyle = "#33691e"; ctx.fillRect(-2, 4, 4, 12);
    for (let i = 0; i < 5; i++){
      const a = (Math.PI * 2 / 5) * i;
      ctx.beginPath();
      ctx.fillStyle = bodyColor;
      ctx.ellipse(Math.cos(a) * 5, Math.sin(a) * 5, 5 + p.stage, 3, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = "#e0e6ea";
    ctx.fillRect(0, -2.5, barrelLen, 5);
    ctx.strokeStyle = "#8fa3ad";
    ctx.lineWidth = 1;
    ctx.strokeRect(0, -2.5, barrelLen, 5);
    ctx.fillStyle = "#ffb300";
    ctx.fillRect(barrelLen - 3, -3.5, 3, 7);
    ctx.restore();
    if (p.eatAnim > 0.15){
      const flashX = Math.cos(angle) * barrelLen, flashY = Math.sin(angle) * barrelLen;
      ctx.save();
      ctx.translate(flashX, flashY);
      ctx.rotate(angle);
      ctx.fillStyle = "rgba(255, 224, 102, 0.95)";
      for (let i = 0; i < 4; i++){
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(6, -3);
        ctx.lineTo(9, 0);
        ctx.lineTo(6, 3);
        ctx.closePath();
        ctx.fill();
        ctx.rotate(Math.PI / 2);
      }
      ctx.restore();
    }
    ctx.beginPath(); ctx.fillStyle = "#ffe066"; ctx.arc(0, 0, 3.5 + p.stage, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "pitcher"){
    const bodyColor = p.bloated ? "#5d4037" : ["#9c27b0", "#7b1fa2", "#4a148c"][p.stage];
    const pulse = p.eatAnim > 0 ? 4 : 0;
    ctx.beginPath(); ctx.fillStyle = bodyColor;
    ctx.ellipse(0, 0, 7 + p.stage * 2 + pulse, 12 + p.stage * 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "#311b46";
    ctx.ellipse(0, -10 - p.stage * 2, 5 + p.stage, 3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "thorn"){
    ctx.beginPath(); ctx.fillStyle = def.color;
    const spikes = 7, R = 9, r = 4;
    for (let i = 0; i < spikes * 2; i++){
      const rad = i % 2 === 0 ? R : r;
      const a = (Math.PI / spikes) * i;
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  } else if (p.type === "snapper"){
    // クラシックなハエトリソウ: 茎+パクパクする顎
    const bodyColor = p.bloated ? "#6b6b4a" : ["#8bc34a", "#66bb6a", "#2e7d32"][p.stage];
    ctx.fillStyle = "#33691e"; ctx.fillRect(-2, 2, 4, 13);
    const jawOpen = p.eatAnim > 0 ? 0.1 : 0.55;
    const R = 6 + p.stage * 1.5;
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(0, -3, R, R * 0.7, 0, Math.PI * (1 - jawOpen * 0.4), Math.PI * (2 + jawOpen * 0.4)); // 上顎
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -1, R, R * 0.55, 0, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = "#b71c1c"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = -2; i <= 2; i++){
      ctx.moveTo(i * R * 0.35, -3 - jawOpen * 5);
      ctx.lineTo(i * R * 0.35, -3 - jawOpen * 5 - 3);
    }
    ctx.stroke();
  } else if (p.type === "mint"){
    // 涼しげなミント: 葉のロゼット + 冷気の輝き
    const glow = 0.5 + 0.3 * Math.sin(performance.now() / 400);
    ctx.fillStyle = `rgba(128, 222, 234, ${glow * 0.35})`;
    ctx.beginPath(); ctx.arc(0, 0, 13 + p.stage * 2, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++){
      const a = (Math.PI * 2 / 4) * i + Math.PI / 4;
      ctx.beginPath();
      ctx.fillStyle = ["#4db6ac", "#26a69a", "#00897b"][p.stage];
      ctx.ellipse(Math.cos(a) * 5, Math.sin(a) * 5, 7 + p.stage, 3.5, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = "#e0f7fa"; ctx.arc(0, 0, 3 + p.stage * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "sundew"){
    // モウセンゴケ: 赤い触手+粘液のしずく
    ctx.fillStyle = ["#e57373", "#ef5350", "#c62828"][p.stage];
    for (let i = 0; i < 7; i++){
      const a = (Math.PI * 2 / 7) * i;
      const len = 8 + p.stage * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * len * 0.55, Math.sin(a) * len * 0.55, len * 0.5, 2, a, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.arc(Math.cos(a) * len, Math.sin(a) * len, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ["#e57373", "#ef5350", "#c62828"][p.stage];
    }
    ctx.beginPath(); ctx.fillStyle = "#8d1f1f"; ctx.arc(0, 0, 3.5 + p.stage, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "dandelion"){
    // ワタゲタンポポ: 茎の上のふわふわ綿毛
    ctx.fillStyle = "#7cb342"; ctx.fillRect(-1.5, 2, 3, 13);
    const R = 8 + p.stage * 2;
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.arc(0, -4, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++){
      const a = (Math.PI * 2 / 10) * i + performance.now() / 3000;
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(Math.cos(a) * R, -4 + Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.fillStyle = "#fff9c4"; ctx.arc(0, -4, 3, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "chestnut"){
    // バクダングリ: トゲトゲの実 + 点滅する導火線ランプ
    ctx.beginPath(); ctx.fillStyle = "#8d6e63";
    const spikes2 = 9, R2 = 10, r2 = 6.5;
    for (let i = 0; i < spikes2 * 2; i++){
      const rad = i % 2 === 0 ? R2 : r2;
      const a = (Math.PI / spikes2) * i;
      const px2 = Math.cos(a) * rad, py2 = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "#5d4037"; ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    const blink = Math.sin(performance.now() / 200) > 0;
    ctx.beginPath(); ctx.fillStyle = blink ? "#ff5252" : "#7f2222";
    ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "lavender"){
    // ラベンダー: 紫の穂 + ゆらめく香りの円
    const aura = 0.25 + 0.15 * Math.sin(performance.now() / 500);
    ctx.strokeStyle = `rgba(179, 157, 219, ${aura})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#558b2f"; ctx.fillRect(-1.5, 0, 3, 15);
    const tiers = 3 + p.stage;
    for (let i = 0; i < tiers; i++){
      ctx.beginPath();
      ctx.fillStyle = ["#b39ddb", "#9575cd", "#7e57c2"][p.stage];
      ctx.ellipse(0, -2 - i * 4.5, 5 - i * 0.8, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (p.type === "orchid"){
    // スナイパーラン: 優雅な花 + 長い狙撃バレル
    const angle = p.aimAngle != null ? p.aimAngle : -Math.PI / 2;
    ctx.fillStyle = "#33691e"; ctx.fillRect(-1.5, 4, 3, 12);
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = "#eceff1";
    ctx.fillRect(0, -1.5, 16 + p.stage * 3, 3);
    ctx.fillStyle = "#ff8a65";
    ctx.fillRect(14 + p.stage * 3, -2.5, 3, 5);
    ctx.restore();
    for (let i = 0; i < 5; i++){
      const a = (Math.PI * 2 / 5) * i - Math.PI / 2;
      ctx.beginPath();
      ctx.fillStyle = ["#f8bbd0", "#f48fb1", "#ec407a"][p.stage];
      ctx.ellipse(Math.cos(a) * 5, Math.sin(a) * 5, 5.5, 3, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = "#fce4ec"; ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "rafflesia"){
    // ラフレシア: 巨大な赤い5弁花 + 斑点
    const R3 = 11 + p.stage * 2.5;
    for (let i = 0; i < 5; i++){
      const a = (Math.PI * 2 / 5) * i - Math.PI / 2;
      ctx.beginPath();
      ctx.fillStyle = p.bloated ? "#8d3a32" : ["#e57373", "#d32f2f", "#b71c1c"][p.stage];
      ctx.ellipse(Math.cos(a) * R3 * 0.6, Math.sin(a) * R3 * 0.6, R3 * 0.55, R3 * 0.4, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255,224,178,0.8)";
    for (let i = 0; i < 8; i++){
      const a = (Math.PI * 2 / 8) * i;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * R3 * 0.62, Math.sin(a) * R3 * 0.62, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.fillStyle = "#4e1414"; ctx.arc(0, 0, R3 * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "#7a2020"; ctx.arc(0, 0, R3 * 0.22, 0, Math.PI * 2); ctx.fill();
  }

  if (isRooted(p)){
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (p.lastStandBuffed){
    ctx.strokeStyle = `rgba(255,215,0,${0.5 + 0.5 * Math.sin(performance.now() / 150)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();
  }
  if (!isRooted(p) && isAtPeakValue(p)){
    drawPeakTileBorder(p);
  }
  ctx.restore();

  if (p.hp < p.maxHp){
    const w = 24, h = 3;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(p.x - w / 2, p.y - 24, w, h);
    ctx.fillStyle = p.hp / p.maxHp > 0.4 ? "#8bc34a" : "#e53935";
    ctx.fillRect(p.x - w / 2, p.y - 24, w * Math.max(0, p.hp / p.maxHp), h);
  }
}

function drawCuteEyes(size, spacingRatio){
  const eyeR = Math.max(1.6, size * 0.28);
  const pupilR = eyeR * 0.5;
  const offsetX = size * spacingRatio;
  const offsetY = -size * 0.12;
  [-1, 1].forEach(dir => {
    ctx.beginPath();
    ctx.fillStyle = "#ffffff";
    ctx.arc(dir * offsetX, offsetY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#161616";
    ctx.arc(dir * offsetX + dir * pupilR * 0.3, offsetY + pupilR * 0.2, pupilR, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawBug(b){
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.type === "fly"){
    const flap = Math.sin(performance.now() / 60 + b.x) * 3;
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath(); ctx.ellipse(-b.size * 0.8, -flap, b.size * 0.7, b.size * 0.35, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.size * 0.8, flap, b.size * 0.7, b.size * 0.35, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd400";
    ctx.beginPath(); ctx.arc(0, 0, b.size, 0, Math.PI * 2); ctx.fill();
    drawCuteEyes(b.size, 0.34);
  } else if (b.type === "beetle"){
    ctx.fillStyle = "#29b6f6";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size, b.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    drawCuteEyes(b.size, 0.42);
  } else if (b.type === "slug"){
    const squish = 1 + Math.sin(performance.now() / 250 + b.x) * 0.08;
    ctx.fillStyle = "#aeea00";
    ctx.beginPath(); ctx.ellipse(0, b.size * 0.15, b.size * 1.3 * squish, b.size * 0.65 / squish, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#7cb342";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-b.size * 0.4, -b.size * 0.3); ctx.lineTo(-b.size * 0.55, -b.size * 0.9);
    ctx.moveTo(b.size * 0.4, -b.size * 0.3); ctx.lineTo(b.size * 0.55, -b.size * 0.9);
    ctx.stroke();
    ctx.fillStyle = "#aeea00";
    ctx.beginPath(); ctx.arc(-b.size * 0.55, -b.size * 0.95, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.size * 0.55, -b.size * 0.95, 2, 0, Math.PI * 2); ctx.fill();
    drawCuteEyes(b.size, 0.4);
  } else if (b.type === "worm"){
    const wig = Math.sin(performance.now() / 120 + b.y) * 2;
    ctx.fillStyle = "#ff8a80";
    ctx.beginPath(); ctx.arc(-b.size * 1.1, wig, b.size * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-b.size * 0.55, -wig * 0.5, b.size * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, b.size * 0.85, 0, Math.PI * 2); ctx.fill();
    drawCuteEyes(b.size * 0.85, 0.4);
  } else if (b.type === "hornet"){
    const flap = Math.sin(performance.now() / 45 + b.x) * 3.5;
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.ellipse(-b.size * 0.7, -flap - 2, b.size * 0.8, b.size * 0.3, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.size * 0.7, flap - 2, b.size * 0.8, b.size * 0.3, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffa000";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size * 1.1, b.size * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3e2723";
    for (let i = -1; i <= 1; i++){
      ctx.fillRect(i * b.size * 0.45 - 1.5, -b.size * 0.6, 3, b.size * 1.2);
    }
    // 尻の針
    ctx.beginPath(); ctx.fillStyle = "#3e2723";
    ctx.moveTo(b.size * 1.05, 0); ctx.lineTo(b.size * 1.5, 0); ctx.lineTo(b.size * 1.05, 2.5);
    ctx.closePath(); ctx.fill();
    drawCuteEyes(b.size * 0.8, 0.42);
  } else if (b.type === "ant"){
    ctx.fillStyle = "#d84315";
    ctx.beginPath(); ctx.arc(-b.size * 0.9, 0, b.size * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, b.size * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.size * 0.85, 0, b.size * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8d2f0b"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.size * 1.1, -b.size * 0.5); ctx.lineTo(b.size * 1.5, -b.size * 0.95);
    ctx.moveTo(b.size * 1.3, -b.size * 0.4); ctx.lineTo(b.size * 1.7, -b.size * 0.7);
    ctx.stroke();
    ctx.save(); ctx.translate(b.size * 0.85, 0); drawCuteEyes(b.size * 0.7, 0.4); ctx.restore();
  } else if (b.type === "grasshopper"){
    const hop = Math.abs(Math.sin(performance.now() / 180 + b.x)) * 6;
    ctx.translate(0, -hop);
    ctx.fillStyle = "#7cb342";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size * 1.2, b.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    // 後ろ脚
    ctx.strokeStyle = "#558b2f"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-b.size * 0.3, b.size * 0.3);
    ctx.lineTo(-b.size * 1.0, -b.size * 0.5);
    ctx.lineTo(-b.size * 1.3, b.size * 0.5 + hop);
    ctx.stroke();
    // 触角
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.size * 0.9, -b.size * 0.3); ctx.lineTo(b.size * 1.5, -b.size * 0.9);
    ctx.stroke();
    ctx.save(); ctx.translate(b.size * 0.6, -b.size * 0.1); drawCuteEyes(b.size * 0.6, 0.4); ctx.restore();
  } else if (b.type === "pillbug"){
    ctx.fillStyle = "#78909c";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size * 1.15, b.size * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    // 装甲の体節
    ctx.strokeStyle = "#455a64"; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++){
      ctx.beginPath();
      ctx.moveTo(i * b.size * 0.38, -b.size * 0.72);
      ctx.quadraticCurveTo(i * b.size * 0.45, 0, i * b.size * 0.38, b.size * 0.72);
      ctx.stroke();
    }
    drawCuteEyes(b.size * 0.75, 0.42);
  } else if (b.type === "bagworm"){
    // 蓑(三角の袋)からちょこんと顔
    ctx.fillStyle = "#8d6e63";
    ctx.beginPath();
    ctx.moveTo(0, -b.size * 1.2); ctx.lineTo(b.size * 0.9, b.size * 0.8); ctx.lineTo(-b.size * 0.9, b.size * 0.8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(-b.size * (0.3 + i * 0.25), b.size * (0.1 + i * 0.25));
      ctx.lineTo(b.size * (0.3 + i * 0.25), b.size * (0.1 + i * 0.25));
      ctx.stroke();
    }
    ctx.fillStyle = "#ffcc80";
    ctx.beginPath(); ctx.arc(0, -b.size * 0.85, b.size * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(0, -b.size * 0.85); drawCuteEyes(b.size * 0.45, 0.42); ctx.restore();
  } else if (b.type === "snail"){
    // 殻(渦巻き) + 体
    ctx.fillStyle = "#ffe0b2";
    ctx.beginPath(); ctx.ellipse(b.size * 0.2, b.size * 0.35, b.size * 1.1, b.size * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a1724e";
    ctx.beginPath(); ctx.arc(-b.size * 0.25, -b.size * 0.25, b.size * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#6d4c33"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 4; a += 0.3){
      const rr = b.size * 0.75 * (a / (Math.PI * 4));
      const px3 = -b.size * 0.25 + Math.cos(a) * rr, py3 = -b.size * 0.25 + Math.sin(a) * rr;
      if (a === 0) ctx.moveTo(px3, py3); else ctx.lineTo(px3, py3);
    }
    ctx.stroke();
    ctx.strokeStyle = "#d7a86e"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.size * 0.9, 0); ctx.lineTo(b.size * 1.1, -b.size * 0.7);
    ctx.moveTo(b.size * 1.1, 0.5); ctx.lineTo(b.size * 1.4, -b.size * 0.55);
    ctx.stroke();
    ctx.save(); ctx.translate(b.size * 0.95, b.size * 0.1); drawCuteEyes(b.size * 0.5, 0.42); ctx.restore();
  } else if (b.type === "locust"){
    const flap2 = Math.sin(performance.now() / 50 + b.y) * 3;
    ctx.fillStyle = "rgba(220,255,200,0.5)";
    ctx.beginPath(); ctx.ellipse(-b.size * 0.4, -flap2 - 2, b.size, b.size * 0.3, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#9ccc65";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size * 1.15, b.size * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(b.size * 0.6, -b.size * 0.05); drawCuteEyes(b.size * 0.55, 0.4); ctx.restore();
  } else if (b.type === "boss"){
    // ヌシカブト: 巨大な角付きカブトムシ + 王冠
    const stomp = Math.sin(performance.now() / 300) * 1.5;
    ctx.translate(0, stomp);
    ctx.fillStyle = "#4e342e";
    ctx.beginPath(); ctx.ellipse(0, 0, b.size * 1.1, b.size * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#6d4c41";
    ctx.beginPath(); ctx.ellipse(0, -b.size * 0.15, b.size * 0.8, b.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    // 角
    ctx.strokeStyle = "#3e2723"; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(b.size * 0.55, -b.size * 0.3);
    ctx.quadraticCurveTo(b.size * 1.35, -b.size * 0.85, b.size * 1.15, -b.size * 1.35);
    ctx.stroke();
    // 王冠
    ctx.fillStyle = "#ffd740";
    ctx.beginPath();
    const cy2 = -b.size * 0.95;
    ctx.moveTo(-b.size * 0.45, cy2);
    ctx.lineTo(-b.size * 0.45, cy2 - 6);
    ctx.lineTo(-b.size * 0.22, cy2 - 2);
    ctx.lineTo(0, cy2 - 7);
    ctx.lineTo(b.size * 0.22, cy2 - 2);
    ctx.lineTo(b.size * 0.45, cy2 - 6);
    ctx.lineTo(b.size * 0.45, cy2);
    ctx.closePath(); ctx.fill();
    drawCuteEyes(b.size * 0.8, 0.4);
  }
  // 状態異常の表示
  const now2 = performance.now();
  if (now2 < b.slowUntil){
    ctx.strokeStyle = "rgba(128,222,234,0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, b.size + 3, 0, Math.PI * 2); ctx.stroke();
  }
  if (b.poison && now2 < b.poison.until){
    ctx.fillStyle = "rgba(174,234,0,0.85)";
    const bub = (now2 / 150) % 8;
    ctx.beginPath(); ctx.arc(b.size * 0.5, -b.size - bub, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  if (isStunned(b)){
    ctx.fillStyle = "#ffd740";
    for (let i = 0; i < 3; i++){
      const a = now2 / 250 + (Math.PI * 2 / 3) * i;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (b.size + 4), -b.size * 0.6 + Math.sin(a) * 3, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  if (b.hp < b.maxHp){
    const w = b.size * 2, h = 3;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(b.x - w / 2, b.y - b.size - 8, w, h);
    ctx.fillStyle = "#e53935"; ctx.fillRect(b.x - w / 2, b.y - b.size - 8, w * Math.max(0, b.hp / b.maxHp), h);
  }
}

function drawProjectile(proj){
  ctx.save();
  ctx.translate(proj.x, proj.y);
  ctx.rotate(proj.angle);
  ctx.fillStyle = "#c9a227";
  ctx.beginPath();
  ctx.ellipse(0, 0, 6, 2.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7c5a10";
  ctx.beginPath();
  ctx.ellipse(3, 0, 2.5, 1.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFarmerTilling(e){
  const progress = 1 - e.timer / e.maxTimer;
  const alpha = e.timer < 0.15 ? e.timer / 0.15 : 1;
  const swingPhase = Math.min(0.999, progress * HOE_SWINGS) % 1;
  const raisedAngle = -Math.PI * 0.7;
  const downAngle = -Math.PI * 0.1;
  const hoeAngle = swingPhase < 0.5
    ? raisedAngle + (downAngle - raisedAngle) * (swingPhase / 0.5)
    : downAngle + (raisedAngle - downAngle) * ((swingPhase - 0.5) / 0.5);

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalAlpha = alpha;
  const bodyY = -16;

  ctx.strokeStyle = "#4a3222";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-3, bodyY + 13); ctx.lineTo(-4, bodyY + 21); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, bodyY + 13); ctx.lineTo(4, bodyY + 21); ctx.stroke();

  ctx.fillStyle = "#8d6e4a";
  ctx.beginPath(); ctx.ellipse(0, bodyY + 7, 5, 8, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#f0c090";
  ctx.beginPath(); ctx.arc(0, bodyY - 2, 4.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#5a8f4a";
  ctx.beginPath(); ctx.ellipse(0, bodyY - 5, 6, 2.2, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(3, bodyY + 3);
  ctx.rotate(hoeAngle);
  ctx.strokeStyle = "#f0c090";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, 0); ctx.stroke();
  ctx.strokeStyle = "#6b4a2a";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(20, 0); ctx.stroke();
  ctx.fillStyle = "#8a8a8a";
  ctx.fillRect(19, -3, 4, 6);
  ctx.restore();

  if (swingPhase > 0.42 && swingPhase < 0.58){
    ctx.fillStyle = "rgba(180,150,110,0.5)";
    ctx.beginPath(); ctx.arc(15, bodyY + 17, 5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function hexToRgba(hex, alpha){
  const v = parseInt(hex.slice(1), 16);
  const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawAttackRange(p){
  const def = CONFIG.plants[p.type];
  const stats = predationStats(p);
  // 攻撃範囲(なければ地雷の爆風・バフ範囲を表示)
  let range = stats ? stats.range : null;
  if (!range && def.mine) range = def.mine.blastRange;
  if (!range && def.boostByStage) range = CONFIG.grid.cell * 1.5;
  if (!range) return;
  ctx.beginPath();
  ctx.arc(p.x, p.y, range, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(def.color, 0.12);
  ctx.fill();
  ctx.strokeStyle = hexToRgba(def.color, 0.75);
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawRangeEffect(e){
  const t = 1 - e.timer / e.maxTimer;       // 0 -> 1 over lifetime
  const fade = e.timer / e.maxTimer;         // 1 -> 0
  const ease = 1 - Math.pow(1 - t, 3);       // easeOutCubic for the ripple
  if (e.lineTo){ // 対空攻撃などの攻撃線
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.lineTo.x, e.lineTo.y);
    ctx.strokeStyle = hexToRgba(e.color, 0.8 * fade);
    ctx.lineWidth = 2;
    ctx.stroke();
    return;
  }
  // filled tint of the full range that fades out
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.range, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(e.color, 0.22 * fade);
  ctx.fill();
  // outer boundary flash
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.range, 0, Math.PI * 2);
  ctx.strokeStyle = hexToRgba(e.color, 0.85 * fade);
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // expanding shockwave ripple from center to the range edge
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.range * ease, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,255,255,${0.7 * fade})`;
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawWarningVignette(){
  if (plants.length === 0 || plants.length > CONFIG.warning.lowCount) return;
  const t = performance.now() / 300;
  const pulse = (Math.sin(t) + 1) / 2;
  const alpha = 0.15 + pulse * 0.35;
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
  grad.addColorStop(0, "rgba(255,0,0,0)");
  grad.addColorStop(1, `rgba(255,0,0,${alpha})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function render(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#4a382a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(MARGIN, MARGIN);
  drawScenery();
  drawBackground();
  drawFence();
  if (debugSmell) drawSmellHeatmap();
  if (selectedPlant && tooltipEl.style.display === "block") drawAttackRange(selectedPlant);
  rangeEffects.forEach(drawRangeEffect);
  plants.forEach(drawPlant);
  bugs.forEach(drawBug);
  projectiles.forEach(drawProjectile);
  plantingEffects.forEach(drawFarmerTilling);
  ctx.restore();
  drawWarningVignette();
  updateHUD();
  maybeUpdateTooltip();
}

function updateHUD(){
  moneyEl.textContent = "¥" + Math.floor(money);
  scoreEl.textContent = "¥" + Math.floor(score);
  waveEl.textContent = waveManager.waveNumber;
  if (gameState === "ready"){
    timerEl.textContent = "-";
  } else if (waveManager.waveNumber === 0){
    timerEl.textContent = "まもなく開始...";
  } else {
    timerEl.textContent = "ウェーブ " + waveManager.waveNumber + " (残り虫" + bugs.length + ")";
  }
  if (plants.length > 0 && plants.length <= CONFIG.warning.lowCount){
    warnEl.style.display = "inline";
    warnEl.textContent = "⚠ 植物残り" + plants.length + "株";
  } else {
    warnEl.style.display = "none";
  }
  updateWaveBar();
  updatePaletteHighlight();
}

function updateWaveBar(){
  if (gameState !== "playing"){
    waveBarFillEl.style.width = "0%";
    waveBarLabelEl.textContent = "-";
    return;
  }
  const remaining = Math.max(0, waveManager.cycleTimer);
  const pct = Math.max(0, Math.min(100, (remaining / waveManager.cycleDuration) * 100));
  waveBarFillEl.style.width = pct + "%";
  waveBarFillEl.style.background = pct > 50
    ? "linear-gradient(90deg, #4caf50, #8bc34a)"
    : pct > 20
      ? "linear-gradient(90deg, #ffb300, #ffd740)"
      : "linear-gradient(90deg, #e53935, #ff7043)";
  const nextTheme = themeFor(waveManager.waveNumber + 1);
  const nextLabel = nextTheme === "boss" ? "ボス!!" : CONFIG.bugs[nextTheme].label;
  waveBarLabelEl.textContent = "次: " + nextLabel + " まで " + Math.ceil(remaining) + "秒";
}

// ---------- Tooltip ----------
tooltipEl.innerHTML =
  '<div class="tt-title" id="ttTitle"></div>' +
  '<div>状態: <span id="ttState"></span></div>' +
  '<div>HP: <span id="ttHp"></span></div>' +
  '<div>売値: ¥<span id="ttSell"></span></div>' +
  '<div class="tt-warn" id="ttWarn">根付き中(売却不可)</div>' +
  '<button id="sellBtn">売却する</button>';
const ttTitle = document.getElementById("ttTitle");
const ttState = document.getElementById("ttState");
const ttHp = document.getElementById("ttHp");
const ttSell = document.getElementById("ttSell");
const ttWarn = document.getElementById("ttWarn");
const sellBtn = document.getElementById("sellBtn");
sellBtn.addEventListener("click", () => {
  if (selectedPlant && !isRooted(selectedPlant)){
    sellPlant(selectedPlant);
    hideTooltip();
  }
});

function showTooltip(p){
  selectedPlant = p;
  tooltipEl.style.display = "block";
  const rect = canvas.getBoundingClientRect();
  const screenX = rect.left + (p.x + MARGIN) * (rect.width / canvas.width);
  const screenY = rect.top + (p.y + MARGIN) * (rect.height / canvas.height);
  positionTooltip(screenX, screenY);
  updateTooltipContent();
}
function hideTooltip(){
  selectedPlant = null;
  tooltipEl.style.display = "none";
}
function positionTooltip(plantX, plantY){
  const estWidth = 170, estHeight = 145, margin = 26;
  let left = plantX - estWidth / 2;
  let top = plantY - estHeight - margin;
  if (top < 8) top = plantY + margin;
  left = clampNum(left, 8, window.innerWidth - estWidth - 8);
  top = clampNum(top, 8, window.innerHeight - estHeight - 8);
  tooltipEl.style.left = left + "px";
  tooltipEl.style.top = top + "px";
}
function updateTooltipContent(){
  if (!selectedPlant) return;
  const p = selectedPlant, def = CONFIG.plants[p.type];
  const val = plantSellValue(p);
  let stateLabel = "";
  if (def.sell){
    const t = (performance.now() - p.plantedAt) / 1000;
    stateLabel = t < def.sell.peakTime ? "成長中" : (t < def.sell.peakTime + 8 ? "満開(売り時!)" : "しおれ気味");
  } else if (def.growth || def.growthByTime){
    stateLabel = ["幼体", "成体", "完熟"][p.stage] + (p.bloated ? "(満腹)" : "");
  } else if (def.mine){
    stateLabel = "待機中(触れると爆発)";
  } else {
    stateLabel = "壁";
  }
  const rooted = isRooted(p);
  ttTitle.textContent = def.label;
  ttState.textContent = stateLabel;
  ttHp.textContent = Math.ceil(p.hp) + "/" + Math.ceil(p.maxHp);
  ttSell.textContent = val;
  ttWarn.style.display = rooted ? "block" : "none";
  sellBtn.style.display = rooted ? "none" : "inline-block";
}
function maybeUpdateTooltip(){
  if (!selectedPlant || tooltipEl.style.display !== "block") return;
  const now = performance.now();
  if (now - lastTooltipUpdate > 250){
    lastTooltipUpdate = now;
    updateTooltipContent();
  }
}

// ---------- Palette / input ----------
const PLANT_ORDER = [
  "mitsubana", "thorn", "snapper", "flytrap",
  "mint", "dandelion", "sundew", "pitcher",
  "chestnut", "lavender", "orchid", "rafflesia"
];
function getBaseCombatStats(type){
  const def = CONFIG.plants[type];
  if (!def.predation) return null;
  const base = Array.isArray(def.predation) ? def.predation[0] : def.predation;
  return {
    dmg: base.dmg,
    speed: Math.round((1 / base.interval) * 10) / 10,
    range: Math.round((base.range / CONFIG.grid.cell) * 10) / 10
  };
}
function plantInfoLine(type){
  const def = CONFIG.plants[type];
  const stats = getBaseCombatStats(type);
  let line = def.label + " (¥" + def.cost + ") — " + def.desc;
  if (stats) line += " / 威力" + stats.dmg + "・" + stats.speed + "回/秒・射程" + stats.range + "マス";
  if (def.mine) line += " / 威力" + def.mine.dmg + "・爆風" + Math.round(def.mine.blastRange / CONFIG.grid.cell * 10) / 10 + "マス";
  if (def.boostByStage) line += " / 隣接攻撃力x" + def.boostByStage[0] + "〜x" + def.boostByStage[2];
  return line;
}
function isPlantUnlocked(type){
  return waveManager.waveNumber >= (CONFIG.plants[type].unlockWave || 0);
}
function buildPalette(){
  paletteEl.innerHTML = "";
  PLANT_ORDER.forEach(type => {
    const def = CONFIG.plants[type];
    const btn = document.createElement("div");
    btn.className = "palette-btn";
    btn.dataset.type = type;
    btn.innerHTML =
      '<div class="swatch" style="background:' + def.color + '"></div>' +
      '<div class="pname">' + def.label + '</div>' +
      '<div class="pcost">¥' + def.cost + '</div>' +
      '<div class="plock">W' + (def.unlockWave || 0) + '解禁</div>';
    btn.addEventListener("click", () => {
      if (gameState !== "playing") return;
      if (!isPlantUnlocked(type)) return;
      selectedPlacementType = (selectedPlacementType === type) ? null : type;
      hideTooltip();
      updatePaletteHighlight();
    });
    paletteEl.appendChild(btn);
  });
}
function updatePaletteHighlight(){
  document.querySelectorAll(".palette-btn").forEach(btn => {
    const type = btn.dataset.type;
    const unlocked = isPlantUnlocked(type);
    btn.classList.toggle("selected", selectedPlacementType === type);
    btn.classList.toggle("disabled", !unlocked || money < CONFIG.plants[type].cost);
    btn.classList.toggle("locked", !unlocked);
  });
  const infoEl = document.getElementById("plantInfo");
  if (selectedPlacementType){
    infoEl.textContent = plantInfoLine(selectedPlacementType);
    infoEl.style.display = "block";
  } else {
    infoEl.style.display = "none";
  }
}

function onCanvasClick(e){
  if (gameState !== "playing") return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX - MARGIN;
  const cy = (e.clientY - rect.top) * scaleY - MARGIN;
  const gx = Math.floor(cx / CONFIG.grid.cell), gy = Math.floor(cy / CONFIG.grid.cell);
  if (gx < 0 || gy < 0 || gx >= CONFIG.grid.cols || gy >= CONFIG.grid.rows) return;

  const existing = plantGrid[gy][gx];
  if (existing){
    showTooltip(existing);
    selectedPlacementType = null;
    updatePaletteHighlight();
    return;
  }
  hideTooltip();
  if (selectedPlacementType){
    tryPlacePlant(selectedPlacementType, gx, gy);
  }
}

canvas.addEventListener("click", onCanvasClick);
debugChk.addEventListener("change", () => { debugSmell = debugChk.checked; });

let gameSpeed = 1;
document.getElementById("speedBtn").addEventListener("click", () => {
  gameSpeed = gameSpeed === 1 ? 2 : 1;
  document.getElementById("speedBtn").textContent = gameSpeed === 1 ? "▶ 1x" : "▶▶ 2x";
});

document.getElementById("startBtn").addEventListener("click", () => {
  getAudioCtx();
  instructionsEl.style.display = "none";
  resetGame();
});
document.getElementById("retryBtn").addEventListener("click", () => {
  getAudioCtx();
  resetGame();
});

// ---------- Reset / bootstrap ----------
function resetGame(){
  money = CONFIG.economy.startMoney;
  score = 0;
  plants = [];
  bugs = [];
  projectiles = [];
  plantingEffects = [];
  rangeEffects = [];
  pendingBugs = [];
  plantGrid = makeGrid();
  smellField = new Float32Array(CONFIG.grid.cols * CONFIG.grid.rows);
  selectedPlant = null;
  selectedPlacementType = null;
  everHadMultiplePlants = false;
  hideTooltip();
  waveManager.waveNumber = 0;
  waveManager.cycleTimer = CONFIG.waves.prepTimeBase;
  waveManager.cycleDuration = CONFIG.waves.prepTimeBase;
  waveManager.spawning = false;
  waveManager.spawnedCount = 0;
  waveManager.totalToSpawn = 0;
  waveManager.spawnTimer = 0;
  waveManager.bossPending = false;
  waveManager.seenSpecies = {};
  gameOverEl.style.display = "none";
  gameState = "playing";
  updatePaletteHighlight();
}

buildPalette();
updatePaletteHighlight();
(function(){
  const best = loadHighScore();
  if (best > 0) document.getElementById("titleBest").textContent = "ベストスコア: ¥" + best;
})();

let lastTs = 0;
function frame(ts){
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05) * gameSpeed;
  if (gameState === "playing") update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
