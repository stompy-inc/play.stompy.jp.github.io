<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120d">
  <title>Portrait Admin | THE RATION OFFICE</title>
  <link rel="stylesheet" href="portraits-admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="admin-kicker">DIRECTORATE INTERNAL CHECK</p>
        <h1>人物ポートレート一覧</h1>
        <p class="admin-lead">ゲーム内の人物設定とポートレート画像の対応を確認する管理用ページです。</p>
      </div>
      <a class="game-link" href="index.html">ゲーム画面へ</a>
    </header>

    <section class="summary-strip" id="summaryStrip" aria-label="集計"></section>

    <section class="control-strip" aria-label="絞り込み">
      <label class="control-field">
        <span>検索</span>
        <input id="portraitSearch" type="search" placeholder="名前、職業、ID、特性で検索">
      </label>
      <label class="control-field">
        <span>身体区分</span>
        <select id="kindFilter"></select>
      </label>
      <label class="control-field">
        <span>画像ソース</span>
        <select id="sourceFilter">
          <option value="">すべて</option>
          <option value="portrait-folder">assets/portraits</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label class="control-field">
        <span>登場状態</span>
        <select id="appearanceFilter">
          <option value="">すべて</option>
          <option value="campaign">シフト登場あり</option>
          <option value="reserve">予備人物</option>
          <option value="repeat">複数レコード</option>
        </select>
      </label>
    </section>

    <section class="result-bar" aria-live="polite">
      <p id="resultCount"></p>
    </section>

    <section class="portrait-grid" id="portraitGrid" aria-label="人物一覧"></section>
    <p class="empty-state" id="emptyState" hidden>条件に一致する人物はいません。</p>
  </main>

  <script src="data.js"></script>
  <script src="portraits-admin.js"></script>
</body>
</html>
