<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#080b0c" />
  <title>命令運命 // ORDERED FATE</title>
  <meta name="description" content="楽曲が終わるまで命令に従う。ブロック都市を進む三人称シューティングゲーム。" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./overrides.css" />
</head>
<body>
  <main id="gameShell">
    <canvas id="game" aria-label="命令運命 3Dゲーム"></canvas>

    <div class="scanlines" aria-hidden="true"></div>
    <div id="damageFlash" aria-hidden="true"></div>

    <div id="crosshair" class="crosshair hidden" aria-hidden="true"><i></i><b></b></div>

    <section id="lyricPanel" class="lyric-panel hidden" aria-live="polite">
      <small>内部音声記録</small>
      <p id="lyricLine">轟音、鉄風、硝煙、太陽</p>
    </section>

    <button id="soundButton" class="sound-button" type="button" aria-label="音声のオン・オフ">音声 ON</button>

    <section id="intro" class="screen intro">
      <div class="intro-grid" aria-hidden="true"></div>
      <div class="intro-copy">
        <p class="eyebrow">TACTICAL UNIT BOOT SEQUENCE // AUDIO-LINKED</p>
        <h1><span>命令</span><span>運命</span></h1>
        <p class="lead">前進し、障害を排除せよ。</p>
        <p class="choice">A / D：移動　　SPACE：射撃</p>
        <button id="startButton" class="primary-button" type="button"><span>命令を受領する</span><i>▶</i></button>
      </div>
      <div class="unit-card" aria-hidden="true">
        <div id="unitPreview"></div>
      </div>
    </section>

    <section id="result" class="screen result hidden" aria-live="polite">
      <div class="result-inner">
        <p class="eyebrow">OPERATION COMPLETE // MEMORY LOG</p>
        <h2 id="resultTitle">命令、完遂。</h2>
        <p id="resultQuote" class="result-quote">「ロボットだから仕方ない」</p>
        <div class="result-stats">
          <div><span>従順</span><strong id="finalObedience">000</strong></div>
          <div><span>人間性</span><strong id="finalHumanity">100</strong></div>
          <div><span>破壊</span><strong id="finalDestroyed">00</strong></div>
        </div>
        <p id="resultMessage" class="result-message"></p>
        <button id="retryButton" class="primary-button" type="button"><span>もう一度、従う</span><i>↻</i></button>
      </div>
    </section>

    <div id="touchControls" class="touch-controls hidden" aria-label="タッチ操作">
      <div class="move-buttons">
        <button data-move="left" aria-label="左へ移動">◀</button>
        <button data-move="right" aria-label="右へ移動">▶</button>
      </div>
      <button id="fireButton" class="fire-button" aria-label="射撃">FIRE</button>
    </div>

    <audio id="music" preload="auto" src="./assets/meirei-unmei.wav"></audio>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
